[project]
name = "okpop"
version = "0.1.0"
description = "Tools for collecting, processing, storing, and analyzing population data for Osaka Prefecture."
readme = "README.md"
authors = [
    { name = "shunsk", email = "ok.xmonad@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "nicegui>=3.17.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "requests>=2.34.2",
]

[project.scripts]
okpop = "okpop:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
